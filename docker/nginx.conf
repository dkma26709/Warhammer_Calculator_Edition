# Serves the published Blazor WebAssembly app as a static site.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative redirects, so they stay correct behind a remapped host port.
    absolute_redirect off;

    # The publish step writes a .gz next to every asset (framework, data JSON,
    # index.html); serve those directly instead of compressing on each request.
    gzip_static on;

    # Revalidate everything on every load (cheap 304s via ETag). The data JSON
    # and index.html are not fingerprinted, so without this a browser could
    # keep stale data after a new image is deployed. Blazor caches its own
    # _framework files by integrity hash, so those don't hit the network anyway.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Client-side routes (/builder, /roster, ...) have no file on disk:
    # hand them to index.html and let the Blazor router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A request with a file extension is for a real file; a missing one is a
    # 404, not index.html (which would surface as a JSON parse error in the
    # app). This mirrors the dev server, which only falls back for
    # extension-less paths.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }
}
