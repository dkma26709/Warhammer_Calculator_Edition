# Local builds. Compose merges this file into docker-compose.yml whenever both
# sit in the same folder, so in a checkout:
#   docker compose up --build        -> http://localhost:8080
# The build is tagged warhammer_calculator_edition:local, not GHCR's :latest,
# so a local build and the published image never overwrite each other. To run
# the published image from a checkout, name the base file alone:
#   docker compose -f docker-compose.yml pull
#   docker compose -f docker-compose.yml up -d
#
# The WAR army data is exported from warhammer-armies-revamped during the
# build, at the commit the Dockerfile pins (WAR_PIN). To build from another
# branch, tag or full commit SHA, set WAR_REF (PowerShell / bash):
#   $env:WAR_REF = "<ref>"; docker compose up --build
#   WAR_REF=<ref> docker compose up --build
# The image's tests run against that data, so a ref this app does not support
# yet fails the build.
services:
  web:
    image: warhammer_calculator_edition:local
    build:
      context: .
      args:
        # No value: passed only when WAR_REF is set, else the Dockerfile's pin.
        - WAR_REF
